name: credit-risk-finetuning

x-service-hardening: &service-hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  restart: unless-stopped
  tmpfs:
    - /tmp:size=256m,mode=1777

x-common-environment: &common-environment
  CR_SCHEMA_REGISTRY: /app/configs/schema_registry.yaml
  CR_SCHEMA_REGISTRY_VERSION: "1.4.0"
  CR_ARCHITECTURE_POLICY: /app/configs/architecture_policy.yaml
  CR_ARCHITECTURE_POLICY_VERSION: "1.2.0"
  CR_POLICY_RULES: /app/configs/policy_rules.yaml
  CR_POLICY_RULES_VERSION: "1.0.0"
  CR_SERVICE_TOKEN: ${CR_SERVICE_TOKEN:?Set CR_SERVICE_TOKEN}

services:
  api:
    <<: *service-hardening
    build:
      context: .
      target: runtime
    command: ["uvicorn", "credit_risk.api:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *common-environment
      CR_SERVICE_ROLE: api_gateway
      CR_DATA_SERVICE_URL: http://data-service:8081
      CR_OMLX_BASE_URL: http://host.docker.internal:9905/v1
      CR_QDRANT_URL: http://qdrant:6333
      CR_REVIEWERS: ${CR_REVIEWERS:?Configure reviewers}
      CR_AUDIT_STORE_PATH: /audit/interactions.sqlite3
      # Embeddings come from the native oMLX server, not from inside this container: the
      # API image has no Metal. A semantic model is mandatory; health checks readiness.
      # Empty defaults let operators run lifecycle commands such as `compose stop` on an
      # older checkout. API construction still rejects either missing value before serving.
      CR_EMBEDDING_MODEL: ${CR_EMBEDDING_MODEL:-}
      CR_EMBEDDING_REVISION: ${CR_EMBEDDING_REVISION:-}
      # Never a literal. Supplied from the host environment or a .env file kept out of git.
      CR_OMLX_API_KEY: ${CR_OMLX_API_KEY:-}
    volumes:
      - ./data/audit/api:/audit:rw
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
      - restricted-data
    depends_on:
      data-service:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  data-service:
    <<: *service-hardening
    build:
      context: .
      target: runtime
    command: ["uvicorn", "credit_risk.data_service:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      <<: *common-environment
      CR_SERVICE_ROLE: data_service
      CR_DATABASE_PATH: /data/credit_risk.duckdb
      CR_QUERY_TIMEOUT_SECONDS: "15"
      CR_REVIEW_STORE_PATH: /audit/reviews.sqlite3
    expose:
      - "8081"
    volumes:
      - ./data/curated:/data:ro
      - ./data/audit/reviews:/audit:rw
    networks:
      - restricted-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/internal/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Qdrant needs a writable storage volume, so it cannot take read_only: true, but it
  # gets the rest of the hardening the other services have. No host port: it is reachable
  # only from the API over the internal network.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - restricted-data

  feedback-worker:
    <<: *service-hardening
    profiles: ["batch"]
    build:
      context: .
      target: runtime
    command:
      - python
      - -m
      - credit_risk.feedback
      - /feedback/interactions.sqlite3
      - /training/candidate-batch
      - --exclusions
      - /training/gold_exclusions.json
      - --out-of-time-from
      - "${CR_OUT_OF_TIME_FROM:-2025-01-01}"
    environment:
      <<: *common-environment
      CR_SERVICE_ROLE: feedback_worker
    volumes:
      - ./data/audit/api:/feedback:ro
      - ./data/training:/training:rw
    networks:
      - batch-only
    restart: "no"

  tests:
    build:
      context: .
      target: tests
    profiles: ["test"]
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      <<: *common-environment
      CR_SERVICE_ROLE: api_gateway
      CR_OFFLINE_TEST_MODE: "true"
    volumes:
      - ./tests:/app/tests:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/data/curated:uid=100,gid=101,mode=1777
    networks:
      - test-only
    restart: "no"

networks:
  edge: {}
  restricted-data:
    internal: true
  batch-only:
    internal: true
  test-only:
    internal: true

volumes:
  qdrant-data: {}
