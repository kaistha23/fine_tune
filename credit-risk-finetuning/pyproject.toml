[project]
name = "credit-risk-finetuning"
version = "0.1.0"
description = "Local Qwen fine-tuning, guarded analytics and feedback pipeline for credit risk"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
data = ["polars>=1.20", "pyarrow>=19.0", "openpyxl>=3.1"]
documents = ["python-docx>=1.1", "pymupdf>=1.25"]
# qdrant-client checks the server version on connect and warns on a major/minor
# mismatch. The upper bound keeps the client on the same line as the image pinned
# in compose.yaml; tests/test_compose_architecture.py asserts the two agree.
rag = ["qdrant-client>=1.19,<1.20", "rank-bm25>=0.2.2"]
training = ["mlx-lm[train]>=0.30; platform_system == 'Darwin' and platform_machine == 'arm64'"]
# Qwen3-Embedding runs through the same mlx-lm the trainer uses, so there is no
# second inference stack to keep in step. Darwin/arm64 only; the offline container
# uses oMLX; HashingEmbedder is available only in explicit offline tests.
embedding = ["mlx-lm>=0.30; platform_system == 'Darwin' and platform_machine == 'arm64'"]
evaluation = ["deepeval>=2.0", "ragas>=0.2"]
dev = ["pytest>=8.3", "ruff==0.16.6"]

[project.scripts]
credit-risk-api = "credit_risk.api:run"
credit-risk-build-sft = "credit_risk.dataset:main"
credit-risk-build-feedback = "credit_risk.feedback:main"
credit-risk-evaluate = "credit_risk.evaluation.cli:main"
credit-risk-qualify = "credit_risk.evaluation.calibrate:main"
credit-risk-reindex = "credit_risk.rag.reindex:main"
credit-risk-train = "credit_risk.training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
