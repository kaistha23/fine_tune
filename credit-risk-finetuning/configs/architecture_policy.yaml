version: "1.2.0"
default_deny: true

# Capabilities describe what each service's code actually does, not an aspiration.
# The API does build a parameterised SQL template in memory - that is how the reviewer is
# shown it - but it can never execute one or reach the database file.
roles:
  api_gateway:
    allowed:
      - validate_query_plan
      - compile_parameterised_sql_for_review
      - view_parameterised_sql
      - request_data_service
      - record_sql_review
      - call_model
      - validate_model_output
      # The API records what it served and the corrections analysts write against it.
      # Both are writes to its own append-only logs, never to curated data.
      - record_interaction
      - record_analysis_feedback
    denied:
      - execute_sql
      - execute_read_only_sql
      - edit_and_execute_sql
      - access_database_file
      - mutate_schema
      - train_model
      # The API writes feedback; only the worker reads it back and decides what is
      # trainable. Keeping the read denied here is what stops the service that produced an
      # answer from also grading it.
      - read_feedback
      - write_training_batch
  data_service:
    allowed:
      - validate_query_plan
      - compile_parameterised_sql
      - execute_read_only_sql
      - return_validated_rows
    denied:
      - call_model
      - mutate_database
      - mutate_schema
      - access_feedback
      - record_sql_review
  feedback_worker:
    allowed:
      - read_feedback
      - classify_root_cause
      - write_training_batch
    denied:
      - execute_sql
      - call_model
      - mutate_schema
      - request_data_service
  training_host:
    allowed:
      - read_training_batch
      - train_adapter
      - write_adapter
    denied:
      - access_production_database
      - mutate_schema
