# MLX-LM quantized-LoRA config. Runs natively on macOS only - never inside Docker, which cannot
# reach Apple Metal/ANE.
#
# The base is MLX 4-bit affine quantized (group size 64). MLX-LM calls adapter training
# on quantized weights QLoRA, while this does not imply the original paper's NF4,
# double-quantization or paged-optimizer mechanisms. fine_tune_type remains "lora".
#
# Finding C1 - RESOLVED on this Mac (M5 Pro, 64 GB, macOS 26.5.2, mlx 0.32.2 / mlx-lm
# 0.31.3). mlx-community/Qwen3.5-9B-4bit declares Qwen3_5ForConditionalGeneration and
# carries a vision tower, which was the risk: mlx-lm loads it text-only and the full chain
# was run end to end.
#
#   load + generate      peak 5.18 GB MLX,  5.70 GB RSS
#   50-iter QLoRA        peak 16.98 GB RSS, 20.6 min, adapter 86.6 MB
#   mlx_lm.fuse          5.0 GB directory, quantization preserved
#   reload fused + gen   1.1 s to load, peak 5.19 GB
#
# Do not route training through mlx-vlm: its Qwen3.5 LoRA path has an open p1 corruption
# bug, and there is no reason to, since mlx-lm handles this checkpoint.
#
# Fallback ladder, Qwen3 generation only:
#   1. mlx-community/Qwen3.5-9B-4bit    primary QLoRA target - verified above
#   2. mlx-community/Qwen3.8-27B-4bit   64 GB challenger; QLoRA here is borderline and
#                                       must pass its own memory spike before it is trusted
#   3. mlx-community/Qwen3-14B-4bit     the plans' stable fallback
model: mlx-community/Qwen3.5-9B-4bit
train: true
data: data/training/current
adapter_path: adapters/candidates/credit-risk-v3

fine_tune_type: lora
num_layers: 16
batch_size: 1
epochs: 2
learning_rate: 2.0e-5
max_seq_length: 2048
optimizer: adam
optimizer_config:
  adam: {}
  adamw: {}
  muon: {}
  sgd: {}
  adafactor: {}
lr_schedule: null
early_stopping_patience: 3
early_stopping_min_delta: 0.001

# Train the loss on the assistant turn only. On this prompt shape the input is roughly
# 70% of the tokens, so without masking most of the gradient goes into reproducing the
# factsheet rather than learning the analysis.
mask_prompt: true

# Trades compute for memory. Needed to keep a 9B 4-bit run inside the unified-memory
# envelope alongside the OS and the application stack.
grad_checkpoint: true

lora_parameters:
  # Both plans specify rank 16 / alpha 32. mlx-lm takes the multiplier directly as
  # "scale", so scale = alpha / rank = 2.0.
  rank: 16
  scale: 2.0
  dropout: 0.05
  # Omit keys to adapt every eligible linear module in the selected layers. Workbench
  # runs record either this resolved policy or an explicit Qwen3.5 module allowlist.

steps_per_report: 10
steps_per_eval: 100
save_every: 100
seed: 42

# The plans call for gradient accumulation of 8-16. Confirmed against mlx-lm 0.31.3 during
# the C1 spike: the key is grad_accumulation_steps, and the value is echoed back into the
# adapter_config.json the run writes, which is how an ignored key would have shown up.
# Effective batch is batch_size x this = 8.
grad_accumulation_steps: 8
